name: Release Build

on:
  push:
    tags:
      - "server-v*"
      - "server-*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. server-v1.9.53 or server-latency-tuning-v1.9.53)"
        required: true
      prerelease:
        description: "Mark as pre-release (y/n)"
        required: false
        default: "n"

jobs:
  build:
    name: Build CLI binaries (cross)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF##*/}"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ "$TAG" =~ ^server-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BRANCH="master"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^server-([a-z0-9][a-z0-9._-]{0,62})-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" != "master" ]; then
            BRANCH="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          PRERELEASE="false"
          if [ "$BRANCH" != "master" ] || [ "$INPUT_PRERELEASE" = "y" ]; then
            PRERELEASE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (branch: $BRANCH, tag: $TAG)"

      - name: Check admin JavaScript
        run: node --check internal/admin/static/app.js

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Test release packages
        run: go test ./internal/admin ./internal/server ./internal/transport/vp8channel

      - name: Build cross binaries
        env:
          OLCRTC_VERSION: ${{ steps.version.outputs.version }}
        run: mage cross

      - name: Build admin binaries (linux amd64/arm64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          mkdir -p build
          LDFLAGS="-s -w -X github.com/openlibrecommunity/olcrtc/internal/admin.Version=${VERSION} -X github.com/openlibrecommunity/olcrtc/internal/admin.ReleaseBranch=${RELEASE_BRANCH}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o build/olcrtc-admin-linux-amd64 ./cmd/olcrtc-admin
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o build/olcrtc-admin-linux-arm64 ./cmd/olcrtc-admin

      - name: List artifacts
        run: ls -la build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: olcrtc-binaries
          path: build/

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: olcrtc-binaries
          path: artifacts

      - name: Create release
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          PRE="${{ needs.build.outputs.prerelease }}"
          echo "Artifacts to upload:"
          ls -la artifacts/

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading artifacts to it"
            gh release upload "$TAG" artifacts/* --clobber
          else
            ARGS=("$TAG" --title "$TAG" --notes "Built by .github/workflows/release.yml on $(date -u +%FT%TZ)")
            if [ "$PRE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "${ARGS[@]}" artifacts/*
          fi
